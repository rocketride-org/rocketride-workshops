<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RocketRide Workshops</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/codelab.css">
<script src="assets/analytics.js"></script>
<style>
  .lead{grid-template-columns:1fr}
  .bar nav{display:flex; gap:18px}
  .bar nav a{font-family:var(--mono); font-size:11.5px; color:#9A97BE; border:0}
  .bar nav a:hover{color:#fff}
  @media (max-width:640px){ .bar .tag{display:none} .bar nav{gap:12px} }
  @media (max-width:480px){ .bar nav{display:none} }
  /* workshop heading row: title left, sign-up button far right */
  .ws-head{display:flex; align-items:center; justify-content:space-between; gap:12px 20px; flex-wrap:wrap; margin:0 0 14px}
  .ws-head h2{margin:0}
  .ws-head .acts{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
</style>
</head>
<body data-signup-auto>

<div class="bar">
  <div class="bar-in">
    <img src="assets/brand/rr-wordmark-white.png" alt="RocketRide">
    <span class="tag">Workshops</span>
    <span class="sp"></span>
    <nav>
      <a href="https://docs.rocketride.org">Docs</a>
      <a href="https://github.com/rocketride-org/rocketride-workshops">GitHub</a>
      <a href="https://discord.gg/PMXrtenMsY">Discord</a>
    </nav>
  </div>
  <div class="prog"></div>
</div>

<div class="wrap">
  <div class="lead hero">
    <div>
      <p class="kicker">RocketRide workshops</p>
      <h1>Zero to Agent in an hour</h1>
      <p class="lede">Three projects, done in order: deploy your first app, put an agent inside a real app, then build and deploy an agent of your own. Sign up and do the setup at home before the event, so the hour is all building.</p>
    </div>
  </div>

  <div id="workshops"></div>
</div>


<script src="workshops.js"></script>
<script>
(function(){
  var REPO = 'https://github.com/rocketride-org/rocketride-workshops/blob/main/';
  var TREE = 'https://github.com/rocketride-org/rocketride-workshops/tree/main/';
  var modules = window.MODULES || {};
  var showDrafts = new URLSearchParams(location.search).get('drafts') === '1';
  var list = (window.WORKSHOPS || []).filter(function(w){ return showDrafts || w.status !== 'draft'; });
  var root = document.getElementById('workshops');
  var LABELS = { python: 'Python 3.10+', node: 'Node 20+', pnpm: 'pnpm 10+', yarn: 'Yarn 1', git: 'git' };

  function el(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function link(href, text, cls, download){
    var a = el('a', cls, text);
    a.href = href;
    if (download) a.setAttribute('download', '');
    return a;
  }
  function pad(n){ return (n < 10 ? '0' : '') + n; }

  if (!list.length){ root.appendChild(el('p', null, 'No workshops published yet.')); return; }

  list.forEach(function(w){
    var ids = w.modules || [];
    var total = ids.reduce(function(sum, id){ return sum + ((modules[id] || {}).duration || 0); }, 0);
    var sec = el('section', 'ws');
    var head = el('div', 'ws-head');
    head.appendChild(el('h2', null, w.title));
    var acts = el('div', 'acts');
    var open = el('button', 'signup-open', '1. Sign up for RocketRide Cloud');
    open.type = 'button';
    open.setAttribute('data-signup', '');
    acts.appendChild(open);
    acts.appendChild(link('https://github.com/rocketride-org/rocketride-workshops/blob/main/SETUP.md', '2. Set up at home →', 'btn ghost'));
    head.appendChild(acts);
    sec.appendChild(head);
    var meta = el('div', 'meta');
    meta.appendChild(el('span', 'chip', total + ' min' + (w.feedbackMinutes ? ' + ' + w.feedbackMinutes + ' min feedback' : '') + ' · ' + ids.length + ' projects'));
    if (w.status === 'draft') meta.appendChild(el('span', 'chip draft', 'Draft'));
    sec.appendChild(meta);
    sec.appendChild(el('p', null, w.summary));

    var grid = el('div', 'projects');
    ids.forEach(function(id, i){
      var m = modules[id];
      var card = el('article', 'pcard' + (m ? '' : ' missing'));
      var top = el('div', 'top');
      top.appendChild(el('span', 'stepno', pad(i + 1)));
      top.appendChild(el('p', 'kicker', m ? (i === 0 ? 'Start here' : 'Project ' + (i + 1)) + ' / ' + m.duration + ' min' : 'Missing'));
      card.appendChild(top);
      var h = el('h3');
      // The title link's ::after covers the whole card, so the card opens the guide.
      if (m && m.guide) h.appendChild(link(m.guide, m.title, 'cardlink'));
      else h.textContent = m ? m.title : 'Unknown module: ' + id;
      card.appendChild(h);
      if (m){
        card.appendChild(el('p', null, m.summary));
        var reqs = el('div', 'reqs');
        (m.requires || []).forEach(function(r){ reqs.appendChild(el('span', 'chip', LABELS[r] || r)); });
        card.appendChild(reqs);
        var btns = el('div', 'btns');
        if (m.guide) btns.appendChild(link(m.guide, 'Open the guide →', 'btn'));
        if (m.notebook && m.download !== false)
          btns.appendChild(link(m.notebook, 'Download notebook', 'btn ghost', true));
        // github: a folder in this repo; otherwise the notebook file.
        if (m.github) btns.appendChild(link(TREE + m.github, 'View on GitHub', 'btn ghost'));
        else if (m.notebook) btns.appendChild(link(REPO + m.notebook, 'View on GitHub', 'btn ghost'));
        card.appendChild(btns);
      }
      grid.appendChild(card);
    });
    sec.appendChild(grid);
    root.appendChild(sec);
  });
})();
</script>
<script src="assets/feedback.js"></script>
<script src="assets/signup.js"></script>
</body>
</html>
